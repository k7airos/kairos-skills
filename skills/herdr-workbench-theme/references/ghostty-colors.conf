# akairos-design 工作台配色（与 herdr 深色令牌一致）
# 追加到 ~/.config/ghostty/config。验证环境：macOS + Ghostty 1.4.0。
# 校验：/Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config
# 重载：在 Ghostty 里按 Cmd+Shift+,
background = #0a0a0a
foreground = #ededed
cursor-color = #ad7aee
cursor-text = #0a0a0a
selection-background = #3c1777
selection-foreground = #ededed
palette = 0=#1c1c1c
palette = 1=#ff7a80
palette = 2=#7ccf9b
palette = 3=#e8c468
palette = 4=#7ba7f2
palette = 5=#ad7aee
palette = 6=#5cc8c0
palette = 7=#c4c4c4
palette = 8=#737373
palette = 9=#ff9ea2
palette = 10=#9ddfb4
palette = 11=#f0d68a
palette = 12=#9dbdf6
palette = 13=#c098f0
palette = 14=#82d8d2
palette = 15=#ededed

# 可读性与布局
minimum-contrast = 1.5
window-padding-balance = true
